  <!DOCTYPE html>
  <html>

  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Musical</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.10.3/babel.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.8.0/jszip.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.8.0/xlsx.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-bootstrap@next/dist/react-bootstrap.min.js" crossorigin></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" integrity="sha256-2TnSHycBDAm2wpZmgdi0z81kykGPJAkiUY+Wf97RbvY=" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/styles.css">
  </head>

  <body>
    <div id="root"></div>
    <script type="text/babel" data-presets="react,stage-3">

      //  ██████╗ ██████╗ ███╗   ██╗███████╗████████╗███████╗
      // ██╔════╝██╔═══██╗████╗  ██║██╔════╝╚══██╔══╝██╔════╝
      // ██║     ██║   ██║██╔██╗ ██║███████╗   ██║   ███████╗
      // ██║     ██║   ██║██║╚██╗██║╚════██║   ██║   ╚════██║
      // ╚██████╗╚██████╔╝██║ ╚████║███████║   ██║   ███████║
      //  ╚═════╝ ╚═════╝ ╚═╝  ╚═══╝╚══════╝   ╚═╝   ╚══════╝

      const COLUMN = {
        LINK: 0,
        SONG_NAME: 1,
        ARTIST: 2
      }
      const SELECTION_TYPE = {
        MANUALLY: 'manually',
        EXCEL: 'importFromExcel'
      }

      const initialNumberOfTeams = 0
      const initialTeams = []
      const initialNewTeam = {
        teamMembers: [],
        score: 0
      }

      // ██╗   ██╗████████╗██╗██╗     ███████╗
      // ██║   ██║╚══██╔══╝██║██║     ██╔════╝
      // ██║   ██║   ██║   ██║██║     ███████╗
      // ██║   ██║   ██║   ██║██║     ╚════██║
      // ╚██████╔╝   ██║   ██║███████╗███████║
      //  ╚═════╝    ╚═╝   ╚═╝╚══════╝╚══════╝

      const parseExcel = (file, callback) => {
        var reader = new FileReader()
        var fileName = file.name

        reader.onload = (e) => {
          var data = e.target.result
          var workbook = XLSX.read(data, {
            type: 'binary'
          })
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]]
          const sheetContents = XLSX.utils.sheet_to_json(firstSheet, { header: 1 })
            .filter(el => el.length)

          if (sheetContents.length === 0) {
            alert('Nenhuma música encontrada no excel')
            return
          }

          const mappedContents = sheetContents.map(row => ({
            link: row[COLUMN.LINK],
            songName: row[COLUMN.SONG_NAME],
            artist: row[COLUMN.ARTIST]
          }))
          if (callback) {
            callback({
              result: {
                fileName,
                songList: mappedContents
              }
            })
          }
        }

        reader.onerror = (ex) => {
          if (callback) {
            callback({
              error: ex
            })
          }
        };

        reader.readAsBinaryString(file)
      }

      const getYouTubeVideoId = (url) => {
        var regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/
        var match = url.match(regExp)
        return (match&&match[7].length==11)? match[7] : false
      }
      const formatYouTubeUrl = (videoId, startTime) => `http://www.youtube.com/embed/${videoId}?start=${startTime}`

      const saveLinksDataToStorage = (linksData) => {
        window.localStorage.setItem('linksData', JSON.stringify(linksData))
      }

      const loadLinksDataFromStorage = () => {
        const linksData = window.localStorage.getItem('linksData')
        if (linksData) {
          return JSON.parse(linksData)
        }
        return {
          fileName: null,
          songList: [],
          playlistOrderByIndex: [],
          currentSong: -1
        }
      }

      const saveTeamsDataToStorage = (teamsData) => {
        window.localStorage.setItem('teamsData', JSON.stringify(teamsData))
      }

      const loadTeamsDataFromStorage = () => {
        const teamsData = window.localStorage.getItem('teamsData')
        if (teamsData) {
          return JSON.parse(teamsData)
        }
        return {
          numberOfTeams: initialNumberOfTeams,
          teams: initialTeams
        }
      }

      //  ██████╗ ██████╗ ███╗   ███╗██████╗  ██████╗ ███╗   ██╗███████╗███╗   ██╗████████╗███████╗
      // ██╔════╝██╔═══██╗████╗ ████║██╔══██╗██╔═══██╗████╗  ██║██╔════╝████╗  ██║╚══██╔══╝██╔════╝
      // ██║     ██║   ██║██╔████╔██║██████╔╝██║   ██║██╔██╗ ██║█████╗  ██╔██╗ ██║   ██║   ███████╗
      // ██║     ██║   ██║██║╚██╔╝██║██╔═══╝ ██║   ██║██║╚██╗██║██╔══╝  ██║╚██╗██║   ██║   ╚════██║
      // ╚██████╗╚██████╔╝██║ ╚═╝ ██║██║     ╚██████╔╝██║ ╚████║███████╗██║ ╚████║   ██║   ███████║
      //  ╚═════╝ ╚═════╝ ╚═╝     ╚═╝╚═╝      ╚═════╝ ╚═╝  ╚═══╝╚══════╝╚═╝  ╚═══╝   ╚═╝   ╚══════╝

      const SongSelectionTypeFormSection = ({ songSelectionType, setSongSelectionType }) => {
        return (
          <ReactBootstrap.Row bsPrefix="row mb-3">
            <ReactBootstrap.Form.Check
              type="radio"
              id="songSelectionType_importFromExcel"
              value="importFromExcel"
              label="Importar músicas de arquivo Excel"
              onChange={() => {
                setSongSelectionType(SELECTION_TYPE.EXCEL)
              }}
              checked={songSelectionType === SELECTION_TYPE.EXCEL}
            />
            <ReactBootstrap.Form.Check
              type="radio"
              id="songSelectionType_mannually"
              value="manually"
              label="Colar link do YouTube manualmente"
              onChange={() => {
                setSongSelectionType(SELECTION_TYPE.MANUALLY)
              }}
              checked={songSelectionType === SELECTION_TYPE.MANUALLY}
            />
          </ReactBootstrap.Row>
        )
      }

      const ImportExcelFormSection = ({ fileName, onImportSuccess, onImportFail }) => {
        const importCallback = ({ result, error }) => {
          if (result) {
            onImportSuccess(result)
          } else if (error) {
            onImportFail(error)
          } else {
            console.log('No result or error on import callback')
            onImportFail('Erro genérico')
          }
        }

        const disableFileImport = !!fileName

        return (
          <ReactBootstrap.Row bsPrefix="row mb-3">
            {
              !disableFileImport
              && (
                <>
                  <ReactBootstrap.Form.Label htmlFor="excelFileInput">
                    <span className="line">XLSX com lista de músicas no padrão:</span>
                    <span className="line">[ link do YouTube | nome(s) da música | artista(s) ]</span>
                  </ReactBootstrap.Form.Label>
                  <ReactBootstrap.Form.Control
                    type="file"
                    id="excelFileInput"
                    onChange={e => parseExcel(e.target.files[0], importCallback)}
                  />
                </>
              )
            }
            {
              disableFileImport
              && (
                <>
                  <ReactBootstrap.Col bsPrefix="my-auto col" xs={9}>
                    Arquivo utilizado: {fileName}
                  </ReactBootstrap.Col>
                  <ReactBootstrap.Col>
                    <ReactBootstrap.Button
                      bsPrefix="btn btn-outline-danger w-100"
                      onClick={() => onImportSuccess({fileName: null, songList: []})}
                    >
                      Trocar
                    </ReactBootstrap.Button>
                  </ReactBootstrap.Col>
                </>
              )
            }
          </ReactBootstrap.Row>
        )
      }

      const ManualLinkFormSection = ({ link, setLink }) => {
        return (
          <ReactBootstrap.Row bsPrefix="row mb-3">
            <ReactBootstrap.Form.Label htmlFor="videoSrcInput">Link do vídeo (YouTube)</ReactBootstrap.Form.Label>
            <ReactBootstrap.Form.Control
              type="text"
              id="videoSrcInput"
              value={link}
              onChange={(e) => setLink(e.target.value)}
            />
          </ReactBootstrap.Row>
        )
      }

      const StartTimeFormSection = ({ time, setTime }) => {
        return (
          <ReactBootstrap.Row bsPrefix="row mb-3">
            <ReactBootstrap.Form.Label htmlFor="timeInput">Início do vídeo (em segundos)</ReactBootstrap.Form.Label>
            <ReactBootstrap.Form.Control
              type="number"
              id="timeInput"
              value={time}
              onChange={(e) => setTime(e.target.value)}
            />
          </ReactBootstrap.Row>
        )
      }

      const VideoLinkForm = ({
         initialSongSelectionType,
         initialFileName,
         initialSongList,
         setVideoSrc
      }) => {
        const [link, setLink] = React.useState("")
        const [time, setTime] = React.useState("")
        const [songSelectionType, setSongSelectionType] = React.useState(initialSongSelectionType)
        const [fileName, setFileName] = React.useState(initialFileName)
        const [songList, setSongList] = React.useState(initialSongList)
        const [playlistOrderByIndex, setPlaylistOrderByIndex] = React.useState([])
        const [currentSong, setCurrentSong] = React.useState([])

        const onSongListSet = (newList, newFileName) => {
          saveLinksDataToStorage({
            fileName: newFileName,
            songList: newList,
            playlistOrderByIndex: Array.from(newList.keys()),
            currentSong: -1
          })

          setFileName(newFileName)
          setSongList(newList)
        }

        const onSongSelectionTypeSelect = (newType) => {
          if (songSelectionType !== newType) {
            onSongListSet([])
          }

          setSongSelectionType(newType)
        }

        return (
          <>
            <SongSelectionTypeFormSection songSelectionType={songSelectionType} setSongSelectionType={onSongSelectionTypeSelect} />

            {
              songSelectionType === SELECTION_TYPE.EXCEL
              ? <ImportExcelFormSection
                  fileName={fileName}
                  onImportSuccess={({ songList, fileName }) => onSongListSet(songList, fileName)}
                  onImportFail={() => { alert('Erro ao importar excel') }}
                  disableFileImport={songList.length > 0}
                />
              : <ManualLinkFormSection link={link} setLink={setLink}/>
            }

            <StartTimeFormSection time={time} setTime={setTime} />

            <ReactBootstrap.Row>
              <ReactBootstrap.Button variant="primary" onClick={() => {
                const videoId = getYouTubeVideoId(link)
                const videoSrc = videoId ? formatYouTubeUrl(videoId, time || 0) : ''
                setVideoSrc(videoSrc)
              }}>
                Abrir vídeo
              </ReactBootstrap.Button>
            </ReactBootstrap.Row>
          </>
        )
      }

      const VideoSection = () => {
        const {
          fileName,
          songList,
          playlistOrderByIndex,
          currentSong
        } = loadLinksDataFromStorage()
        const currentVideoSource =
          (songList.length > 0 && currentSong >= 0)
          ? songList[playlistOrderByIndex[currentSong]].link
          : ''
        const [videoSrc, setVideoSrc] = React.useState(currentVideoSource)

        return (
          <div className="p-3">
            <ReactBootstrap.Row>
              <VideoLinkForm
                initialSongSelectionType={songList.length > 0 ? SELECTION_TYPE.EXCEL : SELECTION_TYPE.MANUALLY}
                initialFileName={fileName}
                initialSongList={songList}
                setVideoSrc={setVideoSrc}
              />
            </ReactBootstrap.Row>
            <ReactBootstrap.Row bsPrefix="row mt-3">
              <iframe
                sandbox='allow-scripts allow-same-origin allow-presentation'
                frameBorder="0"
                style={{
                  height: '40vh'
                }}
                srcDoc={`
                  <html style="height: 100%; overflow: hidden;">
                    <body style="height: 100%;">
                      <iframe
                        src=${videoSrc}
                        frameborder="0"
                        allow="autoplay; encrypted-media;"
                        style="height: 100%; width: 100%;"
                      ></iframe>
                    </body>
                  </html>
                `}
              ></iframe>
            </ReactBootstrap.Row>
          </div>
        )
      }

      const ScoreChangeButton = ({ value, variant, onClick }) => (
        <ReactBootstrap.Button bsPrefix={`btn btn-outline-${variant} ml-1`} onClick={() => onClick(parseInt(value))}>
          {value}
        </ReactBootstrap.Button>
      )

      const TeamContainer = ({ id, teamMembers, score, onMemberDelete, onMemberAdd, onScoreChange }) => {
        const addSubtractValue = (value) => {
          onScoreChange(score + value)
        }

        return (
          <ReactBootstrap.Row bsPrefix="row mb-5">
            <ReactBootstrap.Row bsPrefix="row gx-0">
              <ReactBootstrap.Col>
                <h4>Time {id + 1}</h4>
              </ReactBootstrap.Col>
              <ReactBootstrap.Col>
                <h4>{score} pontos</h4>
              </ReactBootstrap.Col>
            </ReactBootstrap.Row>
            <ReactBootstrap.Row bsPrefix="row gx-0 mb-3">
              <ReactBootstrap.Col bsPrefix="col d-grid gap-2 gx-1">
                <ScoreChangeButton value="-20" variant="danger" onClick={addSubtractValue} />
              </ReactBootstrap.Col>
              <ReactBootstrap.Col bsPrefix="col d-grid gap-2 gx-1">
                <ScoreChangeButton value="-10" variant="danger" onClick={addSubtractValue} />
              </ReactBootstrap.Col>
              <ReactBootstrap.Col bsPrefix="col d-grid gap-2 gx-1">
                <ScoreChangeButton value="-5" variant="danger" onClick={addSubtractValue} />
              </ReactBootstrap.Col>
              <ReactBootstrap.Col bsPrefix="col d-grid gap-2 gx-1">
                <ScoreChangeButton value="+5" variant="success" onClick={addSubtractValue} />
              </ReactBootstrap.Col>
              <ReactBootstrap.Col bsPrefix="col d-grid gap-2 gx-1">
                <ScoreChangeButton value="+10" variant="success" onClick={addSubtractValue} />
              </ReactBootstrap.Col>
              <ReactBootstrap.Col bsPrefix="col d-grid gap-2 gx-1">
                <ScoreChangeButton value="+20" variant="success" onClick={addSubtractValue} />
              </ReactBootstrap.Col>
            </ReactBootstrap.Row>
            <ReactBootstrap.Form.Label htmlFor={`addMembers_${id}`}>Adicionar membros (pressione enter após digitar o nome):</ReactBootstrap.Form.Label>
            <ReactBootstrap.Form.Control
              id={`addMembers_${id}`}
              onKeyPress={(e) => {
                if (e.key === 'Enter') {
                  onMemberAdd(e.target.value)
                  e.target.value = ''
                }
              }}
            />
            <ReactBootstrap.Row bsPrefix="row gx-0">
              {teamMembers.map((memberName, memberId) => (
                <ReactBootstrap.Col className="col-sm-4 d-grid gap-2 mt-1 gx-1" key={`${id}_${memberId}`}>
                  <ReactBootstrap.Button variant="light" onClick={() => onMemberDelete(memberId)}>
                    {memberName} ✖
                  </ReactBootstrap.Button>
                </ReactBootstrap.Col>
              ))}
            </ReactBootstrap.Row>
          </ReactBootstrap.Row>
        )
      }

      const TeamsSection = () => {
        const { numberOfTeams: n, teams: t } = loadTeamsDataFromStorage()
        const [numberOfTeams, setNumberOfTeams] = React.useState(n)
        const [teams, setTeams] = React.useState(t)

        const changeNumberOfTeams = (n) => {
          if (numberOfTeams < n) {
            for (let i = numberOfTeams; i < n; i++) {
              if (!teams[i]) {
                teams[i] = initialNewTeam
              }
            }
          }

          setNumberOfTeams(n)
          saveTeamsDataToStorage({ numberOfTeams: n, teams })
        }

        const eraseAllTeamsData = () => {
          if (window.confirm('Você tem certeza de que deseja apagar todos os times, membros e pontos?')) {
            setNumberOfTeams(initialNumberOfTeams)
            setTeams(initialTeams)
            saveTeamsDataToStorage({
              numberOfTeams: initialNumberOfTeams,
              teams: initialTeams
            })
          }
        }

        return (
          <div className="p-3">
            <ReactBootstrap.Row bsPrefix="row mb-5">
              <ReactBootstrap.Form.Label htmlFor="numberOfTeamsInput">Número de times</ReactBootstrap.Form.Label>
              <ReactBootstrap.Form.Control
                type="number"
                id="numberOfTeamsInput"
                value={numberOfTeams}
                onChange={(e) => changeNumberOfTeams(e.target.value)}
              />
            </ReactBootstrap.Row>
            {numberOfTeams > 0 && teams.slice(0, numberOfTeams).map(({ teamMembers, score }, teamId) => (
              <TeamContainer
                key={teamId}
                id={teamId}
                teamMembers={teamMembers}
                score={score}
                onMemberDelete={(memberId) => {
                  const newTeamsArray = [...teams]
                  const newTeamMembers = newTeamsArray[teamId].teamMembers
                  newTeamMembers.splice(memberId, 1)
                  newTeamsArray[teamId] = {
                    ...newTeamsArray[teamId],
                    teamMembers: newTeamMembers
                  }
                  setTeams(newTeamsArray)
                  saveTeamsDataToStorage({ numberOfTeams, teams: newTeamsArray })
                }}
                onMemberAdd={(newMemberName) => {
                  const newTeamsArray = [...teams]
                  newTeamsArray[teamId] = {
                    ...newTeamsArray[teamId],
                    teamMembers: [...newTeamsArray[teamId].teamMembers, newMemberName]
                  }
                  setTeams(newTeamsArray)
                  saveTeamsDataToStorage({ numberOfTeams, teams: newTeamsArray })
                }}
                onScoreChange={(newScore) => {
                  const newTeamsArray = [...teams]
                  newTeamsArray[teamId] = {
                    ...newTeamsArray[teamId],
                    score: newScore
                  }
                  setTeams(newTeamsArray)
                  saveTeamsDataToStorage({ numberOfTeams, teams: newTeamsArray })
                }}
              />
            ))}
            <ReactBootstrap.Row bsPrefix="row d-grid gap-2 mt-5">
              <ReactBootstrap.Button bsPrefix="btn btn-outline-danger" onClick={eraseAllTeamsData}>
                Apagar todos os times, membros e pontos
              </ReactBootstrap.Button>
            </ReactBootstrap.Row>
          </div>
        )
      }

      const App = () => (
        <ReactBootstrap.Container bsPrefix="container mt-5 mb-5">
          <ReactBootstrap.Row>
            <ReactBootstrap.Col>
              <TeamsSection />
            </ReactBootstrap.Col>
            <ReactBootstrap.Col>
              <VideoSection />
            </ReactBootstrap.Col>
          </ReactBootstrap.Row>
        </ReactBootstrap.Container>
      )
      const root = ReactDOM.createRoot(document.getElementById("root"))
      root.render(<App />)
    </script>
  </body>

  </html>
