                        </tr>
                      ))}
                    </tbody>
                  </table>
                  {rows.length === 0 && <div className="empty">Nenhuma música combina com "{filter}".</div>}
                </div>
              </>
            )}
          </section>
        </>
      )
    }

    // ============================================================
    // Aba: Participantes
    // ============================================================
    const addParticipantsByName = (d, names) => {
      const ids = []
      names.forEach(raw => {
        const name = String(raw).trim()
        if (!name) return
        let p = d.participants.find(x => norm(x.name) === norm(name))
        if (!p) { p = { id: uid(), name }; d.participants.push(p) }
        ids.push(p.id)
      })
      return ids
    }

    const ParticipantsTab = ({ data, update }) => {
      const { ask, toast } = useUi()
      const [name, setName] = useState('')
      const nameRef = useRef(null)
      const teamOf = (pid) => data.teams.find(t => t.memberIds.includes(pid))

      const add = (e) => {
        e.preventDefault()
        const n = name.trim()
        if (!n) { nameRef.current.focus(); return }
        if (data.participants.some(p => norm(p.name) === norm(n))) { toast(`${n} já está na lista`, 'error'); return }
        update(d => { addParticipantsByName(d, [n]) })
        setName('')
        nameRef.current.focus()
      }

      const importFile = async (file) => {
        try {
          const names = parseNameRows(await readTableFile(file))
          if (!names.length) { toast('Nenhum nome encontrado no arquivo.', 'error'); return }
          const mode = await askImportMode(ask, 'participante', 'participantes', names.length, data.participants.length)
          if (!mode) return
          update(d => {
            if (mode === 'replace') { d.participants = []; d.teams.forEach(t => { t.memberIds = [] }) }
            addParticipantsByName(d, names)
          })
          toast(`${plural(names.length, 'participante importado', 'participantes importados')}`)
        } catch (err) {
          toast(`Não foi possível ler ${file.name}: ${err.message}`, 'error')
        }
      }

      const exportList = (format) => {
        try {
          const rows = [['Participante']]
          data.participants.forEach(p => rows.push([p.name]))
          exportTable(rows, `participantes-${today()}`, format, 'Participantes')
        } catch (err) { toast(err.message, 'error') }
      }

      const remove = async (p) => {
        const t = teamOf(p.id)
        const ok = await ask({ title: `Excluir ${p.name}?`, message: t ? `${p.name} também sai do time ${t.name}.` : '', actions: [{ label: 'Cancelar', value: null }, { label: 'Excluir', value: true, variant: 'danger' }] })
        if (ok) update(d => { d.participants = d.participants.filter(x => x.id !== p.id); d.teams.forEach(tm => { tm.memberIds = tm.memberIds.filter(id => id !== p.id) }) })
      }

      const removeAll = async () => {
        const ok = await ask({ title: 'Apagar todos os participantes?', message: 'Os times continuam existindo, mas ficam sem membros.', actions: [{ label: 'Cancelar', value: null }, { label: 'Apagar todos', value: true, variant: 'danger' }] })
        if (ok) update(d => { d.participants = []; d.teams.forEach(t => { t.memberIds = [] }) })
      }

      const assign = (pid, teamId) => update(d => {
        d.teams.forEach(t => { t.memberIds = t.memberIds.filter(id => id !== pid) })
        const t = d.teams.find(x => x.id === teamId)
        if (t) t.memberIds.push(pid)
      })

      const rename = (pid, value) => {
        const v = value.trim()
        if (!v) return false
        update(d => { const p = d.participants.find(x => x.id === pid); if (p) p.name = v })
        return true
      }

      const withoutTeam = data.participants.filter(p => !teamOf(p.id)).length

      return (
        <>
          <div className="page-head">
            <div>
              <h2>Participantes</h2>
              <p>Todas as pessoas que vão jogar. Na planilha, um nome por linha na primeira coluna (ou numa coluna chamada "Participante").</p>
            </div>
            <div className="toolbar">
              <FileButton accept=".xlsx,.xls,.csv,.txt" label="Importar" onFile={importFile} />
              <ExportMenu onExport={exportList} />
              <button className="btn btn-ghost btn-danger" onClick={removeAll} disabled={!data.participants.length}>{I.trash}Apagar todos</button>
            </div>
          </div>
          <section className="panel">
            <form className="add-row" onSubmit={add}>
              <div className="field">
                <label htmlFor="p-name">Nome <span className="required">*</span></label>
                <input id="p-name" ref={nameRef} className="input" value={name} onChange={(e) => setName(e.target.value)} autoComplete="off" required />
              </div>
              <button type="submit" className="btn btn-primary">{I.plus}Adicionar participante</button>
            </form>
            {data.participants.length === 0 ? (
              <div className="empty"><strong>Ninguém cadastrado ainda</strong>Adicione nomes acima ou importe uma planilha.</div>
            ) : (
              <>
                <div className="list-filter">
                  <span className="meta num" style={{ marginLeft: 0 }}>{plural(data.participants.length, 'participante', 'participantes')} · {withoutTeam} sem time</span>
                </div>
                <div className="table-wrap">
                  <table>
                    <thead><tr><th style={{ textAlign: 'right' }}>#</th><th>Nome</th><th>Time</th><th><span className="sr-only">Ações</span></th></tr></thead>
                    <tbody>
                      {data.participants.map((p, i) => {
                        const t = teamOf(p.id)
                        return (
                          <tr key={p.id}>
                            <td className="idx">{i + 1}</td>
                            <td>
                              <input className="cell-input" defaultValue={p.name} aria-label="Nome"
                                onBlur={(e) => { if (!rename(p.id, e.target.value)) e.target.value = p.name }}
                                onKeyDown={(e) => { if (e.key === 'Enter') e.currentTarget.blur() }} />
                            </td>
                            <td>
                              <select className="select" value={t ? t.id : ''} onChange={(e) => assign(p.id, e.target.value)} aria-label={`Time de ${p.name}`} disabled={!data.teams.length}>
                                <option value="">{data.teams.length ? 'Sem time' : 'Crie times primeiro'}</option>
                                {data.teams.map(tm => <option key={tm.id} value={tm.id}>{tm.name}</option>)}
                              </select>
                            </td>
                            <td className="actions">
                              <button className="btn btn-sm btn-ghost btn-icon btn-danger" onClick={() => remove(p)} title="Excluir" aria-label={`Excluir ${p.name}`}>{I.trash}</button>
                            </td>
                          </tr>
                        )
                      })}
                    </tbody>
                  </table>
                </div>
              </>
            )}
          </section>
        </>
      )
    }

    // ============================================================
    // Aba: Times
    // ============================================================
    const TeamCard = ({ team, data, update, onRemove }) => {
      const [member, setMember] = useState('')
      const listId = `members-${team.id}`
      const free = data.participants.filter(p => !data.teams.some(t => t.memberIds.includes(p.id)))
      const members = team.memberIds.map(id => data.participants.find(p => p.id === id)).filter(Boolean)

      const addMember = (e) => {
        e.preventDefault()
        const n = member.trim()
        if (!n) return
        update(d => {
          const [pid] = addParticipantsByName(d, [n])
          d.teams.forEach(t => { t.memberIds = t.memberIds.filter(id => id !== pid) })
          const t = d.teams.find(x => x.id === team.id)
          if (t) t.memberIds.push(pid)
        })
        setMember('')
      }

      const cycleColor = () => update(d => {
        const t = d.teams.find(x => x.id === team.id)
        if (t) t.color = TEAM_COLORS[(TEAM_COLORS.indexOf(t.color) + 1) % TEAM_COLORS.length]
      })

      return (
        <article className="team-card" style={{ '--team': team.color }}>
          <div className="team-card-head">
            <button className="swatch" onClick={cycleColor} title="Trocar cor" aria-label={`Trocar cor de ${team.name}`} />
            <input className="cell-input" defaultValue={team.name} key={team.name} aria-label="Nome do time"
              onBlur={(e) => { const v = e.target.value.trim(); if (v) update(d => { const t = d.teams.find(x => x.id === team.id); if (t) t.name = v }); else e.target.value = team.name }}
              onKeyDown={(e) => { if (e.key === 'Enter') e.currentTarget.blur() }} />
            <button className="btn btn-ghost btn-icon btn-danger" onClick={onRemove} title="Remover time" aria-label={`Remover ${team.name}`}>{I.trash}</button>
          </div>
          <div className="team-card-body">
            <label className="score-edit">
              Pontuação
              <input className="input" type="number" value={team.score}
                onChange={(e) => { const v = parseInt(e.target.value, 10); update(d => { const t = d.teams.find(x => x.id === team.id); if (t) t.score = Number.isFinite(v) ? v : 0 }) }} />
            </label>
            <div>
              <div className="label" style={{ marginBottom: 8 }}>{plural(members.length, 'participante', 'participantes')}</div>
              {members.length > 0 ? (
                <div className="chips">
                  {members.map(p => (
                    <span className="chip" key={p.id}>
                      {p.name}
                      <button onClick={() => update(d => { const t = d.teams.find(x => x.id === team.id); if (t) t.memberIds = t.memberIds.filter(id => id !== p.id) })} aria-label={`Tirar ${p.name} do time`} title="Tirar do time">{I.x}</button>
                    </span>
                  ))}
                </div>
              ) : <p className="hint">Nenhum participante ainda.</p>}
            </div>
            <form className="member-add" onSubmit={addMember}>
              <label htmlFor={`add-${team.id}`} className="sr-only">Adicionar participante ao {team.name}</label>
              <input id={`add-${team.id}`} className="input" list={listId} value={member} onChange={(e) => setMember(e.target.value)} placeholder={free.length ? 'Escolha ou digite um nome' : 'Digite um nome'} autoComplete="off" />
              <datalist id={listId}>{free.map(p => <option key={p.id} value={p.name} />)}</datalist>
              <button type="submit" className="btn">{I.plus}Adicionar</button>
            </form>
          </div>
        </article>
      )
    }

    const TeamsTab = ({ data, update }) => {
      const { ask, toast } = useUi()
      const [withScore, setWithScore] = useState(true)

      const addTeam = () => update(d => {
        let n = d.teams.length + 1
        while (d.teams.some(t => norm(t.name) === norm(`Time ${n}`))) n++
        d.teams.push({ id: uid(), name: `Time ${n}`, color: nextTeamColor(d.teams), memberIds: [], score: 0 })
      })

      const removeTeam = async (t) => {
        const ok = await ask({ title: `Remover ${t.name}?`, message: 'Os participantes continuam cadastrados, só ficam sem time. A pontuação do time é perdida.', actions: [{ label: 'Cancelar', value: null }, { label: 'Remover time', value: true, variant: 'danger' }] })
        if (ok) update(d => { d.teams = d.teams.filter(x => x.id !== t.id); d.history = d.history.filter(h => h.teamId !== t.id) })
      }

      const exportTeams = (format) => {
        try {
          const header = withScore ? ['Time', 'Participante', 'Pontuação'] : ['Time', 'Participante']
          const rows = [header]
          data.teams.forEach(t => {
            const names = t.memberIds.map(id => (data.participants.find(p => p.id === id) || {}).name).filter(Boolean)
            ;(names.length ? names : ['']).forEach(n => rows.push(withScore ? [t.name, n, t.score] : [t.name, n]))
          })
          exportTable(rows, `times-${withScore ? 'com-pontos-' : ''}${today()}`, format, 'Times')
        } catch (err) { toast(err.message, 'error') }
      }

      const importFile = async (file) => {
        try {
          const teams = parseTeamRows(await readTableFile(file))
          if (!teams.length) { toast('Nenhum time encontrado. Use as colunas "Time" e "Participante".', 'error'); return }
          if (data.teams.length) {
            const ok = await ask({ title: `Importar ${plural(teams.length, 'time', 'times')}?`, message: 'Os times atuais e o placar serão substituídos. Participantes novos entram na lista de participantes.', actions: [{ label: 'Cancelar', value: null }, { label: 'Substituir times', value: true, variant: 'primary' }] })
            if (!ok) return
          }
          update(d => {
            d.history = []
            d.teams = []
            teams.forEach(t => {
              const memberIds = addParticipantsByName(d, t.members).filter(id => !d.teams.some(x => x.memberIds.includes(id)))
              d.teams.push({ id: uid(), name: t.name, color: nextTeamColor(d.teams), memberIds, score: t.score || 0 })
            })
          })
          toast(`${plural(teams.length, 'time importado', 'times importados')}`)
        } catch (err) {
          toast(`Não foi possível ler ${file.name}: ${err.message}`, 'error')
        }
      }

      const drawTeams = async () => {
        const ok = await ask({ title: 'Sortear os times?', message: `Os ${data.participants.length} participantes serão distribuídos ao acaso entre os ${data.teams.length} times. A formação atual será desfeita; a pontuação continua.`, actions: [{ label: 'Cancelar', value: null }, { label: 'Sortear', value: true, variant: 'primary' }] })
        if (!ok) return
        update(d => {
          d.teams.forEach(t => { t.memberIds = [] })
          shuffle(d.participants).forEach((p, i) => d.teams[i % d.teams.length].memberIds.push(p.id))
        })
      }

      const resetScores = async () => {
        const ok = await ask({ title: 'Zerar o placar?', message: 'Todos os times voltam a 0 pontos.', actions: [{ label: 'Cancelar', value: null }, { label: 'Zerar placar', value: true, variant: 'danger' }] })
        if (ok) update(d => { d.teams.forEach(t => { t.score = 0 }); d.history = [] })
      }

      return (
        <>
          <div className="page-head">
            <div>
              <h2>Times</h2>
              <p>Clique na bolinha para trocar a cor do time. Na planilha, use as colunas "Time" e "Participante" (uma linha por pessoa) e, se quiser, "Pontuação".</p>
            </div>
            <div className="toolbar">
              <button className="btn btn-primary" onClick={addTeam}>{I.plus}Novo time</button>
              <FileButton accept=".xlsx,.xls,.csv,.txt" label="Importar" onFile={importFile} />
              <ExportMenu
                onExport={exportTeams}
                extra={<label className="check"><input type="checkbox" checked={withScore} onChange={(e) => setWithScore(e.target.checked)} />Incluir pontuação</label>}
              />
              <Menu label="Mais">
                {(close) => (
                  <>
                    <button className="menu-item" disabled={!data.teams.length || !data.participants.length} onClick={() => { close(); drawTeams() }}>{I.shuffle}Sortear participantes nos times</button>
                    <button className="menu-item" disabled={!data.teams.length} onClick={() => { close(); resetScores() }}>{I.restart}Zerar placar</button>
                  </>
                )}
              </Menu>
            </div>
          </div>
          {data.teams.length === 0 ? (
            <section className="panel">
              <div className="empty">
                <strong>Nenhum time criado</strong>
                Crie os times e adicione os participantes de cada um.
                <div><button className="btn btn-primary" onClick={addTeam}>{I.plus}Criar o primeiro time</button></div>
              </div>
            </section>
          ) : (
            <div className="teams-grid">
              {data.teams.map(t => <TeamCard key={t.id} team={t} data={data} update={update} onRemove={() => removeTeam(t)} />)}
            </div>
          )}
        </>
      )
    }

    // ============================================================
    // Aba: Ajustes
    // ============================================================
    const SettingsTab = ({ data, update, replaceData }) => {
      const { ask, toast } = useUi()
      const [key, setKey] = useState(data.settings.apiKey)
      const [show, setShow] = useState(false)
      const [test, setTest] = useState(null)

      const saveKey = async (e) => {
        e.preventDefault()
        const k = key.trim()
        update(d => { d.settings.apiKey = k })
        if (!k) { setTest(null); toast('Chave removida'); return }
        setTest({ status: 'loading' })
        try {
          await testApiKey(k)
          setTest({ status: 'ok' })
        } catch (err) {
          setTest({ status: 'error', message: err.message })
        }
      }

      const exportBackup = () => {
        const { settings, ...rest } = data
        const payload = { app: 'desafio-musical', version: 2, exportedAt: new Date().toISOString(), ...rest, settings: { lyrics: settings.lyrics } }
        downloadFile(JSON.stringify(payload, null, 2), `desafio-musical-backup-${today()}.json`, 'application/json')
      }

      const importBackup = async (file) => {
        try {
          const json = JSON.parse(await file.text())
          if (!json || !Array.isArray(json.songs) || !Array.isArray(json.teams)) throw new Error('não parece um backup do Desafio Musical')
          const ok = await ask({ title: 'Restaurar backup?', message: `Músicas, participantes, times e placar atuais serão substituídos pelos do arquivo ${file.name}.`, actions: [{ label: 'Cancelar', value: null }, { label: 'Restaurar', value: true, variant: 'danger' }] })
          if (!ok) return
          replaceData({
            ...emptyData(),
            songs: json.songs, participants: json.participants || [], teams: json.teams, history: json.history || [], currentSongId: json.currentSongId || null,
            settings: { apiKey: data.settings.apiKey, lyrics: !!(json.settings && json.settings.lyrics) }
          })
          toast('Backup restaurado')
        } catch (err) {
          toast(`Não foi possível restaurar: ${err.message}`, 'error')
        }
      }

      const wipe = async () => {
        const ok = await ask({ title: 'Apagar todos os dados?', message: 'Músicas, participantes, times e placar deste navegador serão apagados. A chave da API continua salva.', actions: [{ label: 'Cancelar', value: null }, { label: 'Apagar tudo', value: true, variant: 'danger' }] })
        if (ok) replaceData({ ...emptyData(), settings: data.settings })
      }

      return (
        <>
          <div className="page-head">
            <div>
              <h2>Ajustes</h2>
              <p>Tudo fica salvo neste navegador. Para levar o jogo para outro computador, exporte um backup.</p>
            </div>
          </div>
          <div className="settings-grid">
            <section className="panel">
              <div className="panel-head"><h3 className="panel-title">Busca no YouTube</h3></div>
              <div className="panel-body stack">
                <form className="stack" onSubmit={saveKey}>
                  <div className="field">
                    <label htmlFor="api-key">Chave da YouTube Data API v3</label>
                    <div className="key-row">
                      <input id="api-key" className="input" type={show ? 'text' : 'password'} value={key} onChange={(e) => { setKey(e.target.value); setTest(null) }} autoComplete="off" spellCheck="false" />
                      <button type="button" className="btn btn-ghost" onClick={() => setShow(v => !v)}>{show ? 'Ocultar' : 'Mostrar'}</button>
                      <button type="submit" className="btn btn-primary">Salvar e testar</button>
                    </div>
                  </div>
                  {test && test.status === 'loading' && <span className="hint">Testando a chave…</span>}
                  {test && test.status === 'ok' && <span className="status-ok">Chave funcionando. A busca dentro do site está liberada.</span>}
                  {test && test.status === 'error' && <span className="status-err">{test.message}</span>}
                  <p className="hint">A chave fica guardada só neste navegador e não vai junto no backup. Cada busca gasta cerca de 1% da cota diária grátis, que dá umas 100 buscas por dia. O site lembra das buscas já feitas e não gasta cota de novo com elas.</p>
                </form>
                <div>
                  <div className="label" style={{ marginBottom: 8 }}>Como conseguir uma chave (grátis, uns 5 minutos)</div>
                  <ol className="steps">
                    <li>Entre em <a href="https://console.cloud.google.com/projectcreate" target="_blank" rel="noopener noreferrer">console.cloud.google.com</a> com uma conta Google e <strong>crie um projeto</strong> (qualquer nome).</li>
                    <li>Abra a página da <a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank" rel="noopener noreferrer">YouTube Data API v3</a> e clique em <strong>Ativar</strong>.</li>
                    <li>Vá em <a href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noopener noreferrer">Credenciais</a> › <strong>Criar credenciais</strong> › <strong>Chave de API</strong>.</li>
                    <li>Recomendado: em <strong>Restrições do aplicativo</strong> escolha <strong>Sites</strong> e coloque o endereço onde o jogo está hospedado (ex.: <code>https://seu-usuario.github.io/*</code>). Em <strong>Restrições de API</strong>, deixe só a YouTube Data API v3. Com a restrição de sites, a chave não funciona no arquivo aberto direto do computador.</li>
                    <li>Copie a chave, cole no campo acima e clique em <strong>Salvar e testar</strong>.</li>
                  </ol>
                </div>
              </div>
            </section>
            <div className="stack">
              <section className="panel">
                <div className="panel-head"><h3 className="panel-title">Backup completo</h3></div>
                <div className="panel-body stack">
                  <p className="hint" style={{ fontSize: 'var(--t-sm)' }}>Um arquivo .json com músicas (e vídeos escolhidos), participantes, times e placar.</p>
                  <div className="toolbar" style={{ marginLeft: 0 }}>
                    <button className="btn" onClick={exportBackup}>{I.download}Exportar backup</button>
                    <FileButton accept=".json,application/json" label="Restaurar backup" onFile={importBackup} />
                  </div>
                </div>
              </section>
              <section className="panel">
                <div className="panel-head"><h3 className="panel-title">Começar do zero</h3></div>
                <div className="panel-body">
                  <button className="btn btn-danger" onClick={wipe}>{I.trash}Apagar todos os dados</button>
                </div>
              </section>
            </div>
          </div>
        </>
      )
    }

    // ============================================================
    // App
    // ============================================================
    const TABS = [
      { id: 'game', label: 'Jogo' },
      { id: 'songs', label: 'Músicas', count: d => d.songs.length },
      { id: 'participants', label: 'Participantes', count: d => d.participants.length },
      { id: 'teams', label: 'Times', count: d => d.teams.length },
      { id: 'settings', label: 'Ajustes' }
    ]

    const App = () => {
      const [data, setData] = useState(loadData)
      const [tab, setTab] = useState(() => {
        try { return sessionStorage.getItem('desafioMusical.tab') || 'game' } catch (e) { return 'game' }
      })
      const [dialog, setDialog] = useState(null)
      const [toasts, setToasts] = useState([])

      const update = useCallback((fn) => setData(d => { const n = structuredClone(d); fn(n); return n }), [])

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)) } catch (e) { /* armazenamento indisponível */ }
      }, [data])
      useEffect(() => {
        try { sessionStorage.setItem('desafioMusical.tab', tab) } catch (e) {}
      }, [tab])

      const ask = useCallback((opts) => new Promise(resolve => setDialog({ ...opts, resolve })), [])
      const closeDialog = (value) => { if (dialog) dialog.resolve(value); setDialog(null) }
      const toast = useCallback((message, kind = 'info') => {
        const id = uid()
        setToasts(t => [...t, { id, message, kind }])
        setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), kind === 'error' ? 6000 : 3000)
      }, [])
      const ui = useMemo(() => ({ ask, toast }), [ask, toast])

      const played = data.songs.filter(s => s.played).length
      const props = { data, update, goTo: setTab }

      return (
        <UiContext.Provider value={ui}>
          <header className="topbar">
            <h1 className="brand">Desafio <span>Musical</span></h1>
            <nav className="tabs" role="tablist" aria-label="Seções">
              {TABS.map(t => (
                <button key={t.id} role="tab" className="tab" aria-selected={tab === t.id} onClick={() => setTab(t.id)}>
                  {t.label}
                  {t.count && <span className="count">{t.count(data)}</span>}
                </button>
              ))}
            </nav>
            {data.songs.length > 0 && (
              <div className="topbar-meta num"><strong>{played}</strong> de {data.songs.length} músicas tocadas</div>
            )}
          </header>
          <main>
            {tab === 'game' && <GameTab {...props} />}
            {tab === 'songs' && <SongsTab {...props} />}
            {tab === 'participants' && <ParticipantsTab {...props} />}
            {tab === 'teams' && <TeamsTab {...props} />}
            {tab === 'settings' && <SettingsTab {...props} replaceData={setData} />}
          </main>
          <Dialog dialog={dialog} onClose={closeDialog} />
          <div className="toasts" role="status" aria-live="polite">
            {toasts.map(t => <div key={t.id} className={`toast ${t.kind === 'error' ? 'error' : ''}`}>{t.message}</div>)}
          </div>
        </UiContext.Provider>
      )
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />)
  </script>
</body>
</html>
